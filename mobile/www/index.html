<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1, viewport-fit=cover" />
<title>起業しよ。</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #0a0a0a;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .shell {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>
  <!--
    このファイルはcapacitor.config.tsのserver.url設定によりアプリ起動時には
    実際には表示されない(WebViewは直接server.urlへ遷移するため)。
    Capacitor CLIがwebDirの存在を要求するためのプレースホルダーであり、
    万一server.urlの読み込みに失敗した場合の最低限のフォールバック表示のみを行う。
  -->
  <div class="shell">
    <p>起業しよ。を読み込み中です…</p>
  </div>
</body>
</html>
