name: Generate Release Keystore (one-time)

# 「起業しよ。」のRelease AAB署名用keystoreを1回だけ生成するための
# 使い捨てワークフロー。
#
# - 通常のpush/PRでは絶対に実行されず、手動(workflow_dispatch)でのみ実行できる。
# - リポジトリのコードは一切checkoutしない(既存のNext.js/Capacitor/Android実装、
#   および mobile/android/app/build.gradle や android-build.yml の署名設定には
#   一切触れない・依存しない、完全に独立したジョブ)。
# - 生成した秘密情報(パスワード)は生成直後に::add-mask::でログ出力からマスクし、
#   その後も標準出力へechoしていない(set -xも使用しない)。
# - keystore本体(バイナリファイル)と、パスワード/base64情報は、あえて別々の
#   2つのartifactに分けてアップロードする(一方だけが漏れても単体では
#   悪用できないようにするため)。
# - artifactのretentionは1日に短縮し、ダウンロード後は速やかに
#   GitHub上のartifact自体を削除することを前提とする。
#
# 生成完了後、GitHub Secretsへ以下の4つを登録する:
#   ANDROID_KEYSTORE_BASE64   (kigyoshiyo-release-keystore-credentials artifact内)
#   ANDROID_KEYSTORE_PASSWORD (同上)
#   ANDROID_KEY_ALIAS         (同上)
#   ANDROID_KEY_PASSWORD      (同上)
# ↑これらの名前は mobile/android/app/build.gradle が実際に読む
#   環境変数名(ANDROID_KEYSTORE_PATH/PASSWORD/ALIAS/PASSWORD)と、
#   .github/workflows/android-build.yml のcheck-release-secrets/
#   build-release-aabジョブが参照するSecrets名に合わせてある。
#
# 登録が完了したら、このワークフローファイル自体を削除することを推奨する
# (keystore生成用のコードを長期間リポジトリに残す必要はないため)。

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-keystore:
    name: Generate release keystore
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate keystore and credentials (secrets never echoed to logs)
        shell: bash
        run: |
          set -euo pipefail

          ALIAS="kigyoshiyo-release"
          STORE_PASS="$(openssl rand -base64 24 | tr -d '\n')"
          KEY_PASS="$(openssl rand -base64 24 | tr -d '\n')"

          # 生成直後に即マスク登録する。以降このジョブのログにこれらの値が
          # 出力されても "***" に置換される(::add-mask::自体はログに
          # 表示されない、GitHub公式のマスク登録コマンド)。
          echo "::add-mask::${STORE_PASS}"
          echo "::add-mask::${KEY_PASS}"

          mkdir -p keystore-out credentials-out

          keytool -genkeypair -v \
            -keystore keystore-out/kigyoshiyo-release.keystore \
            -storetype PKCS12 \
            -alias "${ALIAS}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${STORE_PASS}" \
            -keypass "${KEY_PASS}" \
            -dname "CN=Kigyoshiyo, OU=App, O=Kigyoshiyo, L=Tokyo, ST=Tokyo, C=JP" \
            > /dev/null

          base64 -w0 keystore-out/kigyoshiyo-release.keystore > credentials-out/ANDROID_KEYSTORE_BASE64.txt

          {
            echo "ANDROID_KEY_ALIAS=${ALIAS}"
            echo "ANDROID_KEYSTORE_PASSWORD=${STORE_PASS}"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASS}"
          } > credentials-out/passwords.txt

      - name: Upload keystore file (artifact 1/2)
        uses: actions/upload-artifact@v7
        with:
          name: kigyoshiyo-release-keystore-file
          path: keystore-out/kigyoshiyo-release.keystore
          retention-days: 1
          if-no-files-found: error

      - name: Upload credentials (artifact 2/2)
        uses: actions/upload-artifact@v7
        with:
          name: kigyoshiyo-release-keystore-credentials
          path: credentials-out/
          retention-days: 1
          if-no-files-found: error
