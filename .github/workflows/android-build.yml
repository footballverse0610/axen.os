name: Android Debug Build

# 「起業しよ。」をCapacitor経由でAndroid Debug APKとしてビルドするworkflow。
# ローカル(Claude Codeのサンドボックス環境)ではdl.google.comへの通信が
# 組織ポリシーで遮断されており、Android Gradle Plugin自体を取得できず
# ビルドできなかったため、GitHub-hosted runner(Ubuntu)上で実行する。
#
# ビルド対象自体は mobile/ 配下のCapacitorラッパーのみだが、Capacitorは
# WebView内で動くルートNext.jsアプリのJS(依存関係・src/app・
# src/components/capacitor/以下のネイティブ連携コード)をそのまま
# バンドルして実行するため、それらの変更もAndroidの動作に影響しうる。
# そのためpushトリガーのpathsには、Android動作に影響しうる最小限の
# ルート側パスも含めている(Web版全体の変更まで無条件に含めるものではない)。
#
# 今回はDebug APKのビルド成功確認のみが目的のため、Release署名・keystoreの
# 設定は行っていない(bundleRelease/assembleReleaseはこのworkflowには含まない)。

"on":
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"
      - "package.json"
      - "package-lock.json"
      - "src/app/**"
      - "src/components/capacitor/**"

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Install Capacitor dependencies (mobile/)
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: kigyoshiyo-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
