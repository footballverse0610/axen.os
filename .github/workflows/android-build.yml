name: Android Debug Build

# 「起業しよ。」をCapacitor経由でAndroid Debug APKとしてビルドするworkflow。
# ローカル(Claude Codeのサンドボックス環境)ではdl.google.comへの通信が
# 組織ポリシーで遮断されており、Android Gradle Plugin自体を取得できず
# ビルドできなかったため、GitHub-hosted runner(Ubuntu)上で実行する。
#
# 対象は mobile/ 配下のCapacitorラッパーのみ。リポジトリルートのNext.jsアプリ
# (src/等)は関与しない。
#
# 今回はDebug APKのビルド成功確認のみが目的のため、Release署名・keystoreの
# 設定は行っていない(bundleRelease/assembleReleaseはこのworkflowには含まない)。

"on":
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  check-release-secrets:
    name: Check Release signing secrets
    runs-on: ubuntu-latest
    outputs:
      has-signing: ${{ steps.check.outputs.has-signing }}
    steps:
      # secretsコンテキストはjob直下のif:では参照できない仕様のため、
      # ここでstep(run:)の中で判定してjob outputとして公開し、
      # 後続jobのif:からはneeds経由(needsコンテキストはjob-level ifで利用可能)
      # で参照する。
      - name: Check whether release signing secrets are set
        id: check
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ] && [ "$HAS_STORE_PASSWORD" = "true" ] && [ "$HAS_KEY_ALIAS" = "true" ] && [ "$HAS_KEY_PASSWORD" = "true" ]; then
            echo "has-signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-signing=false" >> "$GITHUB_OUTPUT"
          fi

  build-release-aab:
    name: Build Android Release AAB
    runs-on: ubuntu-latest
    needs: check-release-secrets

    # Release keystoreのSecretsが未登録の間は、このjob自体をskipする
    # (失敗ではなくskippedとして表示され、CI全体は緑のまま)。
    # 4つのSecretsがすべて登録されて初めて実行される:
    #   ANDROID_KEYSTORE_BASE64    : release keystore(.jks/.keystore)をbase64エンコードしたもの
    #   ANDROID_KEYSTORE_PASSWORD  : keystoreのstoreパスワード
    #   ANDROID_KEY_ALIAS          : keystore内の署名鍵のalias
    #   ANDROID_KEY_PASSWORD       : 署名鍵自体のパスワード
    # keystore本体・パスワード類はこのリポジトリには一切含まれておらず、
    # 今回のcommitでも作成していない。実行時にSecretsからbase64を復号し
    # $RUNNER_TEMP(リポジトリ外の一時ディレクトリ)にのみ書き出すため、
    # チェックアウトしたワークツリー内には現れず、成果物アップロードの
    # 対象パスにも含まれない。
    if: ${{ needs.check-release-secrets.outputs.has-signing == 'true' }}

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Install Capacitor dependencies (mobile/)
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build Release AAB
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload Release AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: kigyoshiyo-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # android-actions/setup-android@v4のpackages入力のデフォルトは
          # 'tools platform-tools'。ここで言う'tools'はAndroid SDKの
          # レガシーな"tools"パッケージ(旧monitor/ddms等を含む古いSDK Tools)
          # で、Googleのsdkmanagerリポジトリから既に削除されており、
          # 常に "Failed to find package 'tools'" で失敗する
          # (実行ログで確認: sdkmanagerがexit code 1で終了)。
          # このビルドで実際に必要なのはadb等を含む platform-tools のみで、
          # compileSdk/build-toolsはGradle(AGP)が google() リポジトリ経由で
          # 自前解決するため、legacyな'tools'は不要。
          packages: "platform-tools"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Install Capacitor dependencies (mobile/)
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: kigyoshiyo-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Run Android lint (Debug)
        working-directory: mobile/android
        run: ./gradlew lintDebug --no-daemon

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kigyoshiyo-lint-report
          path: mobile/android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
