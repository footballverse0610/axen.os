name: Android Debug Build

# 「起業しよ。」をCapacitor経由でAndroid Debug APKとしてビルドするworkflow。
# ローカル(Claude Codeのサンドボックス環境)ではdl.google.comへの通信が
# 組織ポリシーで遮断されており、Android Gradle Plugin自体を取得できず
# ビルドできなかったため、GitHub-hosted runner(Ubuntu)上で実行する。
#
# 対象は mobile/ 配下のCapacitorラッパーのみ。リポジトリルートのNext.jsアプリ
# (src/等)は関与しない。
#
# 今回はDebug APKのビルド成功確認のみが目的のため、Release署名・keystoreの
# 設定は行っていない(bundleRelease/assembleReleaseはこのworkflowには含まない)。

"on":
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # android-actions/setup-android@v4のpackages入力のデフォルトは
          # 'tools platform-tools'。ここで言う'tools'はAndroid SDKの
          # レガシーな"tools"パッケージ(旧monitor/ddms等を含む古いSDK Tools)
          # で、Googleのsdkmanagerリポジトリから既に削除されており、
          # 常に "Failed to find package 'tools'" で失敗する
          # (実行ログで確認: sdkmanagerがexit code 1で終了)。
          # このビルドで実際に必要なのはadb等を含む platform-tools のみで、
          # compileSdk/build-toolsはGradle(AGP)が google() リポジトリ経由で
          # 自前解決するため、legacyな'tools'は不要。
          packages: "platform-tools"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Install Capacitor dependencies (mobile/)
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: kigyoshiyo-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
